<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a66c2">
<title>Float</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- First run: ask for location, then (optionally) why they're here -->
<div id="welcome" hidden>
  <div class="welcome-box" id="welcome-box"></div>
</div>

<header class="top">
  <div class="bar">
    <div class="brand" aria-label="Float">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0a66c2"/>
        <path d="M5 13c3-3 5-3 8 0s5 3 8 0 5-3 6-1" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M5 20c3-3 5-3 8 0s5 3 8 0 5-3 6-1" fill="none" stroke="#9cc8f2" stroke-width="2.6" stroke-linecap="round"/></svg>
      Float
    </div>
    <button class="place-chip" id="place-chip" title="Change location">📍 <span id="place-name">Set location</span></button>
    <div class="phase" role="group" aria-label="Flood phase">
      <button data-phase="before" aria-pressed="false">Before</button>
      <button data-phase="during" aria-pressed="false">During</button>
      <button data-phase="after" aria-pressed="false">After</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="home"><span class="ic">🏠</span>Home</button>
    <button role="tab" data-tab="nearby"><span class="ic">📍</span>Nearby</button>
    <button role="tab" data-tab="help"><span class="ic">🤝</span>Help<span class="count" id="help-count" hidden></span></button>
    <button role="tab" data-tab="alerts"><span class="ic">🔔</span>Alerts<span class="count" id="alerts-count" hidden></span></button>
    <button role="tab" data-tab="guides"><span class="ic">📘</span>Guides</button>
    <button role="tab" data-tab="me"><span class="ic">👤</span>Me</button>
  </nav>
</header>
<div id="offline-banner" role="alert" hidden></div>

<main>
  <section id="tab-home" class="page" role="tabpanel" hidden></section>
  <section id="tab-nearby" class="page" role="tabpanel" hidden>
    <div id="nearby-top"></div>
    <div class="map-shell" id="map-shell" hidden><div id="leaflet-map"></div></div>
    <div id="nearby-list"></div>
  </section>
  <section id="tab-help" class="page" role="tabpanel" hidden></section>
  <section id="tab-alerts" class="page" role="tabpanel" hidden></section>
  <section id="tab-guides" class="page" role="tabpanel" hidden></section>
  <section id="tab-me" class="page" role="tabpanel" hidden></section>
  <section id="tab-manager" class="page" role="tabpanel" hidden></section>
  <section id="tab-about" class="page" role="tabpanel" hidden></section>
</main>

<dialog id="site-dialog">
  <div class="dlg-head"><span id="dlg-title">Photo</span><button class="btn small ghost" id="dlg-close">Close</button></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>
<div id="toast" role="status" hidden></div>

<script src="/static/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
