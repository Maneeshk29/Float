<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Float</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0a66c2"/>
        <path d="M5 13c3-3 5-3 8 0s5 3 8 0 5-3 6-1" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M5 20c3-3 5-3 8 0s5 3 8 0 5-3 6-1" fill="none" stroke="#9cc8f2" stroke-width="2.6" stroke-linecap="round"/></svg>
      Float
    </div>
    <form class="search" id="search-form" role="search">
      <label for="search-input" class="sr-only">Search an address</label>
      <input id="search-input" type="search" placeholder="Search your address" autocomplete="off">
      <div id="search-results" hidden></div>
    </form>
    <div class="status-row">
      <span class="pill" id="net-pill">Connecting</span>
      <span class="pill" id="gb10-pill">GB10</span>
      <button class="icon-btn" id="btn-large" aria-pressed="false" title="Larger text">A+</button>
      <button class="icon-btn" id="btn-contrast" aria-pressed="false" title="High contrast">Contrast</button>
    </div>
  </div>
  <div class="nav2">
    <div class="phase" role="group" aria-label="Flood phase">
      <button data-phase="before" aria-pressed="false">Before</button>
      <button data-phase="during" aria-pressed="false">During</button>
      <button data-phase="after" aria-pressed="false">After</button>
    </div>
    <span class="phase-note" id="phase-note"></span>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="home">Home</button>
      <button role="tab" data-tab="outlook">Outlook</button>
      <button role="tab" data-tab="alerts">Alerts<span class="count" id="alerts-count" hidden></span></button>
      <button role="tab" data-tab="shelter">Shelter<span class="count" id="shelter-count" hidden></span></button>
      <button role="tab" data-tab="guides">Guides</button>
      <button role="tab" data-tab="recovery">Recovery</button>
      <button role="tab" data-tab="map">Map</button>
      <button role="tab" data-tab="manager">Manager</button>
      <button role="tab" data-tab="about">About</button>
    </nav>
  </div>
</header>
<div id="offline-banner" role="alert" hidden></div>

<main>
  <section id="tab-home" class="page" role="tabpanel" hidden></section>
  <section id="tab-outlook" class="page" role="tabpanel" hidden></section>
  <section id="tab-alerts" class="page" role="tabpanel" hidden></section>
  <section id="tab-shelter" class="page" role="tabpanel" hidden></section>
  <section id="tab-guides" class="page" role="tabpanel" hidden></section>
  <section id="tab-recovery" class="page" role="tabpanel" hidden></section>
  <section id="tab-map" class="page wide" role="tabpanel" hidden>
    <div class="place-line" id="map-place"></div>
    <div class="map-shell"><div id="leaflet-map"></div></div>
    <div class="legend">
      <span><i style="background:#d84315"></i>Flooded (past)</span><span><i style="background:#2e7d32"></i>Dry (past)</span>
      <span>▲ Gauge rising</span><span>▼ Falling</span><span><i style="background:#00838f"></i>Hospital</span>
      <span><i style="background:#0a66c2"></i>Shelter host</span><span>Tap the map to set your place.</span>
    </div>
  </section>
  <section id="tab-manager" class="page wide" role="tabpanel" hidden></section>
  <section id="tab-about" class="page wide" role="tabpanel" hidden></section>
</main>

<dialog id="site-dialog">
  <div class="dlg-head"><strong id="dlg-title">Photo</strong><button class="btn small ghost" id="dlg-close">Close</button></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>
<div id="toast" role="status" hidden></div>

<script src="/static/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
